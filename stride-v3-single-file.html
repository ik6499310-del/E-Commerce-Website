<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stride – Fashion & Footwear</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6fb;--ink:#0e1033;--card:#fff;--blue:#1b2cc1;--sun:#ffd23f;--coral:#ff5c4d;--mute:#5b5e80;--line:#dcdcee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d24;--ink:#f1f1ff;--card:#171942;--mute:#a0a3d0;--line:#2b2e63}}
:root[data-theme="dark"]{--bg:#0c0d24;--ink:#f1f1ff;--card:#171942;--mute:#a0a3d0;--line:#2b2e63}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--blue);color:#fff}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.04em}
#cartBtn{position:relative;background:var(--sun);color:#0e1033;font-weight:600;padding:9px 16px;border-radius:99px}
#cartBtn.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}
.hero{background:var(--blue);color:#fff;padding:6vh 5vw 14vh;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;position:relative;overflow:hidden;min-height:78vh}
.hero h1{font-size:clamp(2.6rem,8vw,6rem);line-height:.95;letter-spacing:-.04em;font-weight:800}
.hero p{margin:18px 0 26px;max-width:42ch;opacity:.85;line-height:1.5}
.cta{background:var(--sun);color:#0e1033;font-weight:800;padding:15px 28px;border-radius:99px;font-size:1.05rem;text-decoration:none;display:inline-block;transition:transform .2s}
.cta:hover{transform:translateY(-3px) scale(1.04)}
.live{display:inline-flex;gap:8px;align-items:center;font-size:.9rem;margin-top:22px;background:rgba(255,255,255,.12);padding:7px 14px;border-radius:99px}
.dot{width:9px;height:9px;border-radius:50%;background:#4dff9b;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #4dff9b99}100%{box-shadow:0 0 0 12px #4dff9b00}}
.stage{position:relative;display:grid;place-items:center;min-height:300px}
.ring{position:absolute;width:min(70vw,420px);aspect-ratio:1;border-radius:50%;background:var(--sun);animation:morph 8s ease-in-out infinite}
@keyframes morph{50%{border-radius:42% 58% 55% 45%;transform:rotate(25deg) scale(.94)}}
.hero svg{position:relative;width:min(88vw,520px);animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 30px 24px #0006)}
@keyframes float{50%{transform:translateY(-22px) rotate(-5deg)}}
.marq{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;padding:12px 0;font-weight:800;font-size:1.1rem;transform:rotate(-1.2deg);margin:-30px -10px 20px;position:relative;z-index:2}
.marq div{display:inline-block;animation:scroll 22s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
section{padding:40px 5vw}
h2{font-size:clamp(1.8rem,5vw,3rem);letter-spacing:-.03em;font-weight:800}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
.chip{padding:9px 18px;border-radius:99px;border:2px solid var(--line);font-weight:600;transition:.2s}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--line);transition:transform .25s;transform-style:preserve-3d;animation:pop .5s backwards}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.card .pic{border-radius:16px;display:grid;place-items:center;padding:14px;height:160px;overflow:hidden}
.card .pic svg{width:100%;transition:transform .4s}
.card:hover .pic svg{transform:rotate(-10deg) scale(1.12) translateX(6px)}
.card h3{margin:14px 0 2px;font-size:1.15rem}
.card small{color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.price{font-weight:800;font-size:1.2rem}
.add{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;transition:.2s}
.add:hover{background:var(--coral);color:#fff}
.tag{position:absolute;margin:-4px 0 0 -4px;background:var(--coral);color:#fff;font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:99px;transform:rotate(-6deg)}
#toast{position:fixed;left:5vw;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;max-width:88vw;transform:translateY(140%);transition:transform .5s cubic-bezier(.2,1.4,.4,1);font-size:.95rem}
#toast.show{transform:none}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--card);z-index:40;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 20px;transform:translateX(105%);transition:transform .4s;box-shadow:-20px 0 50px #0005;display:flex;flex-direction:column}
#drawer.open{transform:none}
#items{flex:1;overflow:auto;margin:16px 0}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);animation:pop .3s}
.it .sw{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;flex:none}
.it .sw svg{width:46px}
.it div.t{flex:1;font-weight:600;font-size:.95rem}
.qty button{width:26px;height:26px;border-radius:50%;background:var(--line)}
.total{font-size:1.5rem;font-weight:800;display:flex;justify-content:space-between;margin-bottom:12px}
.empty{color:var(--mute);text-align:center;margin-top:40px}
#fly{position:fixed;z-index:50;width:18px;height:18px;border-radius:50%;background:var(--coral);pointer-events:none}
footer{padding:30px 5vw;color:var(--mute);text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
header{flex-wrap:wrap;gap:10px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{color:#fff;padding:8px 14px;border-radius:99px;font-weight:600;opacity:.8}
nav button.on{background:#fff2;opacity:1}
.hd{display:flex;gap:8px;align-items:center}
#acct{background:#fff2;color:#fff;padding:9px 14px;border-radius:99px;font-weight:600}
#bn{background:var(--coral);color:#fff;padding:10px 5vw;font-size:.9rem}
.mu{color:var(--mute);line-height:1.5;margin:6px 0 12px}
#ov{position:fixed;inset:0;background:#0009;z-index:60;display:grid;place-items:center;padding:16px;animation:pop .25s}
#box{background:var(--card);border-radius:24px;padding:26px;width:min(480px,100%);max-height:92vh;overflow:auto}
#box h2{font-size:1.6rem}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fl input,.fl textarea,.fl select{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.fl .w{grid-column:1/-1}
#er{color:var(--coral);font-weight:600;min-height:1.3em;margin-bottom:8px}
.pays{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.pays label{border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600}
.pays input{display:none}.pays label:has(input:checked){border-color:var(--blue);background:var(--blue);color:#fff}
.bd{color:#fff;font-size:.75rem;font-weight:800;padding:4px 11px;border-radius:99px;white-space:nowrap}
.oc{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;animation:pop .5s}
.oc .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.oc .ln{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.trk{height:8px;background:var(--line);border-radius:9px;position:relative;margin:38px 8px 10px}
.trk i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--sun));transition:width 1s}
.tr{position:absolute;top:-28px;font-size:1.5rem;transform:translateX(-50%);transition:left 1s;animation:float 2s ease-in-out infinite}
.stp{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mute);gap:4px;text-align:center}
.stp b{flex:1;font-weight:600}.stp b.d{color:var(--blue)}.stp b.c{color:var(--ink);font-weight:800}
.dec{background:#ff5c4d22;color:var(--coral);padding:10px 14px;border-radius:12px;font-weight:600;margin-top:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;animation:pop .5s backwards}
.kpi small{color:var(--mute)}.kpi b{display:block;font-size:1.9rem;letter-spacing:-.03em}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.p h3{font-size:1rem;margin-bottom:12px}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px}
.cols div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--mute);gap:4px}
.cols i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--blue);height:var(--h);animation:grow .8s}
@keyframes grow{from{height:0}}
.hb{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:.85rem}
.hb div{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.hb i{display:block;height:100%;border-radius:9px;animation:wide .8s}
@keyframes wide{from{width:0!important}}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mute);font-weight:600}
td small{color:var(--mute)}.ac{white-space:nowrap}
.ab{background:var(--blue);color:#fff;padding:7px 12px;border-radius:99px;font-weight:600;font-size:.8rem;margin:2px}
.ab.no{background:var(--coral)}
.lv{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;color:var(--mute);margin-left:12px}
.lv .dot{background:#19b98a}

#sp{position:fixed;top:0;left:0;right:0;height:4px;background:var(--sun);transform:scaleX(0);transform-origin:0;z-index:100}
.hr{position:relative;background:var(--blue);color:#fff;padding:7vh 5vw 14vh;display:grid;grid-template-columns:1.05fr 1fr;gap:10px;align-items:center;min-height:86vh;overflow:hidden;isolation:isolate}
.hr::before,.hr::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.hr::before{width:420px;height:420px;background:#7a4dff;left:-120px;top:-100px}
.hr::after{width:380px;height:380px;background:#00c2ff;right:-80px;bottom:-120px;animation-delay:-6s}
@keyframes drift{to{transform:translate(90px,60px) scale(1.2)}}
.hr h1{font-size:clamp(2.8rem,8.5vw,6.4rem);line-height:.95;letter-spacing:-.045em;font-weight:800}
.hl{display:block;overflow:hidden;padding-bottom:.1em}.wd{display:inline-block;white-space:nowrap}
.ch{display:inline-block;transform:translateY(115%) rotate(10deg);animation:rise .8s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:var(--d)}
@keyframes rise{to{transform:none}}
.hr p{margin:18px 0 26px;max-width:42ch;opacity:.88;line-height:1.5}
.stage{display:block!important;min-height:440px!important;position:relative}
.stage .ring{position:absolute;inset:0;margin:auto;width:min(80vw,400px);height:min(80vw,400px)}
.px{position:absolute;transition:transform .25s ease-out}
.px svg{width:100%;filter:drop-shadow(0 24px 22px #0005);animation:float 5s ease-in-out infinite;animation-delay:var(--fd,0s)}
.marq.b{transform:rotate(1.2deg);background:var(--sun);color:#0e1033;margin-top:-54px}.marq.b div{animation-direction:reverse}
.types{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.ty{flex:none;width:98px;text-align:center;scroll-snap-align:start;border:2px solid var(--line);border-radius:20px;padding:10px 6px;background:var(--card);transition:.25s}
.ty svg{width:58px;transition:transform .35s cubic-bezier(.2,1.4,.4,1)}.ty:hover svg{transform:translateY(-5px) rotate(-6deg) scale(1.12)}
.ty small{display:block;font-weight:600}.ty.on{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-3px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.tools input,.tools select{padding:12px 16px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.tools input{flex:1;min-width:200px}.tools .chip{background:var(--card)}.tools .chip.on{color:#fff}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s,box-shadow .3s}
.pc:hover{box-shadow:0 26px 40px -20px #0e103366}
.pic{position:relative;aspect-ratio:1/1.05;display:grid;place-items:center;overflow:hidden}
.pic svg{position:relative;z-index:1;width:78%;transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
.pc:hover .pic svg{transform:scale(1.12) rotate(-4deg)}
.pic::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:#fff8;transition:transform .6s}.pc:hover .pic::before{transform:scale(1.3)}
.pic::after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),#fff8,transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none}.pc:hover .pic::after{opacity:1}
.ar{transform-box:fill-box;transform-origin:50% 100%}.pc:hover .ar{animation:sway 1.2s ease-in-out}
@keyframes sway{30%{transform:rotate(3deg)}60%{transform:rotate(-3deg)}}
.tg{position:absolute;left:12px;top:12px;z-index:3;background:var(--ink);color:var(--bg);font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:99px}
.hrt{position:absolute;right:10px;top:10px;z-index:3;width:36px;height:36px;border-radius:50%;background:#fffd;color:#b9bbd3;font-size:1.1rem;transition:.25s}
.hrt.on{color:var(--coral);animation:beat .5s}@keyframes beat{40%{transform:scale(1.4)}}
.qvb{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;background:var(--ink);color:var(--bg);padding:10px;border-radius:14px;text-align:center;font-weight:600;transform:translateY(150%);transition:transform .35s cubic-bezier(.2,1,.3,1)}.pc:hover .qvb{transform:none}
.inf{padding:14px 16px 16px}.inf small{color:var(--mute)}.inf h3{margin:2px 0 4px;font-size:1.1rem}
.rt{color:#f5a623;font-size:.85rem;letter-spacing:1px}.rt span{color:var(--mute);letter-spacing:0}
.pr s{color:var(--mute);margin:0 6px;font-size:.9rem}.pr em{color:#19b98a;font-style:normal;font-weight:800;font-size:.85rem}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--i,0)*90ms)}.rv.in{opacity:1;transform:none}
.qv2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.qa{border-radius:20px;display:grid;place-items:center;padding:18px;aspect-ratio:1}.qa svg{width:92%;animation:float 4s ease-in-out infinite}
.qb h2{margin:2px 0 6px}.qb small{color:var(--mute)}.sz{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.sb{min-width:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);font-weight:600;transition:.2s}
.sb.on{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}.sb:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.qrow{display:flex;gap:12px;align-items:center;margin:8px 0 16px}.qrow .qty{display:flex;gap:8px;align-items:center}
.pk{list-style:none;padding:0;color:var(--mute);font-size:.88rem;line-height:1.9}
.sm{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:6px}.fdm{font-size:.88rem;font-weight:600;margin-top:10px}
.bar{height:7px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--sun));transition:width .6s}
.rm{color:var(--mute);padding:4px}
#fly{width:60px;height:60px;border-radius:0;background:none}#fly svg{width:100%}
#alog{position:fixed;inset:0;z-index:90;background:#0b0c22;display:grid;place-items:center;padding:16px;overflow:hidden}
#alog::before,#alog::after{content:"";position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 12s ease-in-out infinite alternate}
#alog::before{width:420px;height:420px;background:#1b2cc1;left:-80px;top:-80px}#alog::after{width:360px;height:360px;background:#8a3ffc;right:-60px;bottom:-60px;animation-delay:-5s}
.lc{position:relative;width:min(400px,100%);background:#ffffff14;backdrop-filter:blur(18px);border:1px solid #ffffff26;border-radius:26px;padding:32px;color:#fff;animation:pop .6s}
.lc h2{font-size:1.8rem}.lc p{opacity:.7;margin:6px 0 18px}.lc label{font-size:.85rem;opacity:.8}
.lc input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid #ffffff2a;background:#0004;color:#fff;font:inherit;margin:6px 0 14px}
.ee{color:#ff8a80;min-height:1.3em;font-weight:600;margin-bottom:6px}.bk{color:#fff;opacity:.7;margin-top:14px;width:100%}
.lc.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
body.adm header,body.adm #bn,body.adm footer{display:none}
.atop{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:var(--ink);color:var(--bg)}
@media(max-width:760px){.hr{grid-template-columns:1fr;min-height:auto}.stage{min-height:340px!important}.qv2{grid-template-columns:1fr}.qa{aspect-ratio:1.3}}
@media(prefers-reduced-motion:reduce){.ch{transform:none}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="sp"></div>
<svg width="0" height="0" style="position:absolute"><symbol id="shoe" viewBox="0 0 200 100"><path d="M10 72C10 52 30 50 45 42L58 20C68 14 80 22 92 31C110 46 130 41 160 55C185 62 193 68 193 78V84H10Z" fill="var(--a)"/><path d="M58 20L98 50L90 57L50 29Z" fill="var(--b)"/><path d="M70 30l8 7M78 24l8 7M86 38l-8-7" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M10 76H193V88Q193 94 185 94H18Q10 94 10 88Z" fill="#fff"/><path d="M10 82H193" stroke="var(--b)" stroke-width="3"/></symbol></svg>
<header><span class="logo">stride.</span>
<nav><button data-v="shop" class="on">Shop</button><button data-v="orders">My orders<span id="oc"></span></button></nav>
<div class="hd"><button id="acct">Login / Register</button><button id="cartBtn" aria-label="Open cart">Cart (<span id="cnt">0</span>)</button></div></header>
<div id="bn" hidden></div>
<div id="vShop">
<div class="hr"><div><h1 id="h1" aria-label="Fresh fits. Every Friday."></h1><p>Shirts, tees, jeans, hoodies, jackets and sneakers. Free delivery above ₹1,499 and 30-day easy returns.</p><a class="cta mag" href="#shop" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'});return false">Shop the drop</a><br><span class="live"><span class="dot"></span><span><b id="viewers">128</b> people are shopping right now</span></span></div><div class="stage" id="stg"></div></div>

<section id="shop"><h2 class="rv">Shop by type</h2><div class="types rv" id="types"></div>
<div class="tools rv"><input id="q" type="search" placeholder="Search shirts, jeans, hoodies…" aria-label="Search"><select id="sort" aria-label="Sort"><option value="feat">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="top">Top rated</option></select><button class="chip" id="wl">♥ Wishlist</button></div>
<p class="mu" id="res"></p><div class="grid" id="grid"></div></section>
</div>
<div id="vOrders" hidden></div>
<div id="vAdmin" hidden></div>

const p=prof||{};modal('<h2>Confirm your order</h2><p class="mu">Total <b>'+rs(ctot())+'</b>'+(shipF()?' (includes ₹99 delivery)':' (free delivery)')+'. Tell us where to deliver.</p>'+form(p)+'<b>Payment</b><div class="pays"><label><input type="radio" name="pay" value="Cash on delivery" checked>Cash on delivery</label><label><input type="radio" name="pay" value="UPI">UPI</label><label><input type="radio" name="pay" value="Card">Card</label></div><button class="cta" id="cf" style="width:100%;border:0">Confirm order · '+rs(ctot())+'</button>');
$("cf").onclick=async()=>{const f=getF();if(!f)return;$("cf").disabled=true;$("cf").textContent="Placing order…";
const items=cl().map(x=>({id:x.p.id,n:x.p.n,z:x.l.s,q:x.l.q,p:x.p.p}));
const o={id:"STR"+Math.floor(1e4+Math.random()*9e4),uid:uid,t:Date.now(),cust:f,items:items,ship:shipF(),total:ctot(),pay:document.querySelector('input[name=pay]:checked').value};
try{await db.collection("orders").doc(o.id).set(o);if(!prof)await saveProf(f);cart={};render();$("drawer").classList.remove("open");closeM();show("orders");confetti();toast("Order "+o.id+" placed. Track it here live.")}
catch(e){$("er").textContent="Couldn’t place the order. Try again.";$("cf").disabled=false;$("cf").textContent="Confirm order"}}};

function renderOrders(){const el=$("vOrders");
if(!db){el.innerHTML='<section><h2>My orders</h2><p class="mu">Sign in to claude.ai to see your orders and track them live.</p></section>';return}
let h='<section><h2>My orders<span class="lv"><span class="dot"></span>Live</span></h2>';
if(!orders.length)h+='<p class="mu">No orders yet. Pick a pair from the shop and it will show up here.</p><button class="cta" style="border:0" onclick="show(\'shop\')">Browse the drop</button>';
orders.forEach(o=>{const s=st(o),i=ST.findIndex(x=>x[0]==s),pct=i<0?0:i/(ST.length-1)*100,hist=(stat[o.id]||{}).h||[{s:"placed",t:o.t}],last=hist[hist.length-1];
h+='<div class="oc"><div class="top"><div><b>'+o.id+'</b><br><small class="mu">'+new Date(o.t).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"})+' · '+esc(o.pay)+'</small></div>'+bd(s)+'</div><div style="margin:12px 0">'+o.items.map(x=>'<div class="ln"><span>'+esc(x.n)+(x.z?' · '+esc(x.z):'')+' × '+x.q+'</span><span>'+rs(x.p*x.q)+'</span></div>').join("")+(o.ship?'<div class="ln"><span>Delivery</span><span>'+rs(o.ship)+'</span></div>':'')+'<div class="ln"><b>Total</b><b>'+rs(o.total)+'</b></div></div>';
if(s=="declined")h+='<div class="dec">This order was declined by the store. You won’t be charged.</div>';
else h+='<div class="trk"><i style="width:'+pct+'%"></i><span class="tr" style="left:'+pct+'%">'+(s=="delivered"?"🎉":"🚚")+'</span></div><div class="stp">'+ST.map((x,j)=>'<b class="'+(j<i?"d":j==i?"c":"")+'">'+x[1]+'</b>').join("")+'</div>';
h+='<p class="mu" style="margin:12px 0 0">Last update: '+LB(last.s)+', '+ago(last.t)+'<br>Delivering to '+esc(o.cust.name)+', '+esc(o.cust.addr)+', '+esc(o.cust.city)+' '+esc(o.cust.pin)+'</p></div>'});
el.innerHTML=h+'</section>'}

async function setS(id,ns){const o=orders.find(x=>x.id==id),old=(stat[id]||{h:[{s:"placed",t:o.t}]}).h;
try{await db.collection("status").doc(id).set({s:ns,h:old.concat([{s:ns,t:Date.now()}])})}catch(e){toast("Couldn’t update the order")}}

function renderAdmin(){const el=$("vAdmin");
if(!adm)return;
const ok=orders.filter(o=>st(o)!="declined"),prod={},city={},pay={},cust={},days=[],cnt={};let rev=0,units=0;
for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({k:d.toDateString(),l:d.toLocaleDateString("en-IN",{weekday:"short"}),v:0})}
ok.forEach(o=>{rev+=o.total;o.items.forEach(i=>{units+=i.q;prod[i.n]=(prod[i.n]||0)+i.q});city[o.cust.city]=(city[o.cust.city]||0)+1;pay[o.pay]=(pay[o.pay]||0)+1;
const c=cust[o.uid]=cust[o.uid]||{n:o.cust.name,o:0,s:0};c.o++;c.s+=o.total;const d=days.find(x=>x.k==new Date(o.t).toDateString());if(d)d.v+=o.total});
orders.forEach(o=>{const s=st(o);cnt[s]=(cnt[s]||0)+1});
const mx=Math.max(1,...days.map(d=>d.v)),aov=ok.length?Math.round(rev/ok.length):0;
const hb=(m,col,f)=>{const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5),t=e.length?e[0][1]:1;return e.length?e.map(x=>'<div class="hb"><span>'+esc(x[0])+'</span><div><i style="width:'+x[1]/t*100+'%;background:'+col+'"></i></div><b>'+(f?f(x[1]):x[1])+'</b></div>').join(""):'<p class="mu">No data yet</p>'};
const sb=ST.concat([["declined","Declined"]]).map(x=>'<div class="hb"><span>'+x[1]+'</span><div><i style="width:'+((cnt[x[0]]||0)/Math.max(1,orders.length)*100)+'%;background:'+COL[x[0]]+'"></i></div><b>'+(cnt[x[0]]||0)+'</b></div>').join("");
const top=Object.values(cust).sort((a,b)=>b.s-a.s).slice(0,5).map(c=>'<div class="hb" style="grid-template-columns:1fr auto auto"><span>'+esc(c.n)+'</span><small>'+c.o+' orders</small><b>'+rs(c.s)+'</b></div>').join("")||'<p class="mu">No customers yet</p>';
const fl=af=="all"?orders:orders.filter(o=>st(o)==af);
const rows=fl.map(o=>{const s=st(o),n=NEXT[s];return '<tr><td><b>'+o.id+'</b><br><small>'+ago(o.t)+'</small></td><td>'+esc(o.cust.name)+'<br><small>'+esc(o.cust.city)+' · '+esc(o.cust.phone)+'</small></td><td>'+o.items.map(i=>esc(i.n)+(i.z?' · '+esc(i.z):'')+' ×'+i.q).join("<br>")+'</td><td>'+rs(o.total)+'<br><small>'+esc(o.pay)+'</small></td><td>'+bd(s)+'</td><td class="ac">'+(n?'<button class="ab" data-o="'+o.id+'" data-s="'+n[0]+'">'+n[1]+'</button><button class="ab no" data-o="'+o.id+'" data-s="declined">Decline</button>':'<small>Closed</small>')+'</td></tr>'}).join("");
const kp=[["Revenue",rs(rev)],["Orders",orders.length],["Avg order value",rs(aov)],["Units sold",units],["Needs action",(cnt.placed||0)]];
el.innerHTML='<div class="atop"><b>Stride Admin</b><button class="ab" data-lo>Log out</button></div>'+(!db?'<div class="dec" style="margin:14px 5vw">Sign in to claude.ai to load live orders.</div>':canEd?'':'<div class="dec" style="margin:14px 5vw">View only: changing order status needs the page owner’s claude.ai login.</div>')+'<section><h2>Dashboard<span class="lv"><span class="dot"></span>Live</span></h2><div class="kpis">'+kp.map((k,i)=>'<div class="kpi" style="animation-delay:'+i*70+'ms"><small>'+k[0]+'</small><b>'+k[1]+'</b></div>').join("")+'</div>'+
'<div class="pn"><div class="p"><h3>Revenue, last 7 days</h3><div class="cols">'+days.map(d=>'<div>'+(d.v?'₹'+Math.round(d.v/100)/10+'k':'')+'<i style="--h:'+Math.max(2,d.v/mx*100)+'%"></i>'+d.l+'</div>').join("")+'</div></div><div class="p"><h3>Orders by status</h3>'+sb+'</div><div class="p"><h3>Top products (units)</h3>'+hb(prod,"var(--blue)")+'</div><div class="p"><h3>Top cities</h3>'+hb(city,"var(--coral)")+'</div><div class="p"><h3>Payment mix</h3>'+hb(pay,"#8a3ffc")+'</div><div class="p"><h3>Top customers</h3>'+top+'</div></div>'+
'<div class="p"><h3>All orders</h3><div class="chips">'+["all"].concat(ST.map(x=>x[0]),["declined"]).map(x=>'<button class="chip fc'+(af==x?" on":"")+'" data-f="'+x+'">'+(x=="all"?"All":LB(x))+'</button>').join("")+'</div><div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr>'+(rows||'<tr><td colspan="6" class="mu">No orders here yet. New orders appear instantly.</td></tr>')+'</table></div></div></section>'}
$("vAdmin").onclick=e=>{if(e.target.closest("[data-lo]")){adm=false;try{sessionStorage.removeItem("adm")}catch(x){}subO();show("shop");return}const b=e.target.closest(".ab"),c=e.target.closest(".fc");if(b)setS(b.dataset.o,b.dataset.s);if(c){af=c.dataset.f;renderAdmin()}};

function draw(){const mine=orders.filter(o=>o.uid==uid&&!["delivered","declined"].includes(st(o))).length;$("oc").textContent=mine?" ("+mine+")":"";
if(view=="orders")renderOrders();if(view=="admin")renderAdmin()}


async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function alogin(){if($("alog"))return;const d=document.createElement("div");d.id="alog";d.innerHTML='<div class="lc"><h2>Stride Admin</h2><p>Sign in to manage orders.</p><label for="au">Username</label><input id="au" autocomplete="username"><label for="ap">Password</label><input id="ap" type="password" autocomplete="current-password"><div id="ae" class="ee"></div><button class="cta" id="ab" style="width:100%;border:0">Sign in</button><button id="abk" class="bk">← Back to store</button></div>';document.body.appendChild(d);
const go=async()=>{let ok=false;try{ok=(await sha($("au").value.trim()+":"+$("ap").value))==AH}catch(e){}
if(ok){adm=true;try{sessionStorage.setItem("adm","1")}catch(e){}d.remove();subO();show("admin")}else{$("ae").textContent="Wrong username or password";const c=d.firstChild;c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake")}};
$("ab").onclick=go;$("ap").onkeydown=e=>{if(e.key=="Enter")go()};$("abk").onclick=()=>{d.remove();show("shop")};setTimeout(()=>$("au").focus(),60)}
function subO(){if(unO)unO();unO=null;if(!db)return;const q=adm?db.collection("orders"):db.collection("orders").where("uid","==",uid);unO=q.onSnapshot(s=>{orders=s.docs.map(d=>d.data()).sort((a,b)=>b.t-a.t);draw()},e=>{})}
async function init(){try{usr=await claude.use("user");db=await claude.use("db")}catch(e){}
if(!db||!usr){const b=$("bn");b.hidden=false;b.textContent="Accounts and orders need a claude.ai sign-in. You can still browse and fill the cart.";draw();return}
uid=await usr.id();canEd=await usr.canEdit();
const ps=await db.collection("data/users/"+uid).doc("profile").get();prof=ps.exists?ps.data():null;acct();if(!prof&&!adm&&location.hash!="#admin")setTimeout(openAcct,1500);
subO();
db.collection("status").onSnapshot(s=>{const ch=s.docChanges();s.docs.forEach(d=>stat[d.id]=d.data());
if(!first)ch.forEach(c=>{const o=orders.find(x=>x.id==c.doc.id&&x.uid==uid);if(o&&c.type!="removed")toast("Order "+o.id+" is now: "+LB(c.doc.data().s))});first=false;draw()})}

function boot(){let d=0;$("h1").innerHTML=[["Fresh","fits."],["Every","Friday."]].map(l=>'<span class="hl">'+l.map(w=>'<span class="wd">'+[...w].map(c=>'<span class="ch" style="--d:'+(d+=45)+'ms">'+c+'</span>').join("")+'</span>').join(" ")+'</span>').join("");
const S=[[8,"28%","12%","46%",12,"0s"],[11,"0%","58%","46%",26,"-1.2s"],[14,"66%","4%","30%",34,"-2.2s"],[4,"0%","4%","32%",20,"-3s"],[7,"62%","50%","34%",28,"-.6s"]];
$("stg").innerHTML='<div class="ring"></div>'+S.map(s=>'<div class="px" data-d="'+s[4]+'" style="left:'+s[1]+';top:'+s[2]+';width:'+s[3]+';--fd:'+s[5]+'">'+art(P.find(p=>p.id==s[0]))+'</div>').join("");
$("mq").textContent="Free delivery above ₹1,499 ✦ New drop every Friday ✦ 30-day returns ✦ ".repeat(8);$("mq2").textContent="Shirts ✦ Tees ✦ Denim ✦ Hoodies ✦ Jackets ✦ Sneakers ✦ ".repeat(8);
types();grid();render();rv();
$("types").onclick=e=>{const b=e.target.closest(".ty");if(b){cat=b.dataset.c;types();grid()}};
$("q").oninput=e=>{qry=e.target.value.trim().toLowerCase();grid()};$("sort").onchange=e=>{srt=e.target.value;grid()};
$("wl").onclick=()=>{wo=!wo;$("wl").classList.toggle("on",wo);grid()};
$("grid").onclick=e=>{const w=e.target.closest(".hrt");if(w){const id=+w.dataset.w;wish.has(id)?wish.delete(id):wish.add(id);saveW();w.classList.toggle("on");if(wo)grid();return}const c=e.target.closest(".pc");if(c)qv(+c.dataset.id)};
if(!RM){document.querySelector(".hr").addEventListener("pointermove",e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;document.querySelectorAll(".px").forEach(p=>{const k=+p.dataset.d;p.style.transform="translate3d("+(-x*k)+"px,"+(-y*k)+"px,0)"})});
document.addEventListener("pointermove",e=>{document.querySelectorAll(".mag").forEach(b=>{const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);b.style.transform=Math.hypot(dx,dy)<110?"translate("+dx*.25+"px,"+dy*.25+"px)":""})})}
if(!RM&&matchMedia("(hover:hover)").matches){$("grid").addEventListener("pointermove",e=>{const c=e.target.closest(".pc");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty("--ry",(x-.5)*10+"deg");c.style.setProperty("--rx",(.5-y)*10+"deg");c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%")});
$("grid").addEventListener("pointerout",e=>{const c=e.target.closest(".pc");if(c&&!c.contains(e.relatedTarget)){c.style.setProperty("--rx","0deg");c.style.setProperty("--ry","0deg")}})}
addEventListener("scroll",()=>{const h=document.documentElement;$("sp").style.transform="scaleX("+h.scrollTop/((h.scrollHeight-h.clientHeight)||1)+")"},{passive:true});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["shop","orders","admin"].includes(h)&&h!=view)show(h)});
const NM=["Rohit","Ananya","Imran","Priya","Karan","Sneha","Aman","Meera"],CT=["Jaipur","Pune","Delhi","Indore","Mumbai","Kolkata","Surat","Chennai"],rd=a=>a[Math.floor(Math.random()*a.length)];
setInterval(()=>{if(view=="shop")toast(rd(NM)+" from "+rd(CT)+" just bought "+rd(P).n)},9000);
setInterval(()=>{const v=$("viewers"),n=+v.textContent+Math.floor(Math.random()*9)-4;v.textContent=Math.max(90,Math.min(190,n))},2000)}
boot();const h0=location.hash.slice(1);if(["orders","admin"].includes(h0))show(h0);init();
